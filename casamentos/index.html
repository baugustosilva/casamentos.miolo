<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index,follow">
  <title>MIOLO — Casamentos</title>
  <meta name="description" content="MIOLO — Casamentos">
  <link rel="icon" type="image/svg+xml" href="../img/brand/miolo-favicon.svg">
  <link rel="preconnect" href="https://type.cargo.site" crossorigin>
  <style>
    @font-face {
      font-display: block;
      font-family: "Monument Grotesk Variable";
      src: url("https://type.cargo.site/files/CargoMonumentGroteskPlusVariable.woff2") format("woff2-variations"),
           url("https://type.cargo.site/files/CargoMonumentGroteskPlusVariable.woff") format("woff");
      font-style: normal;
      font-weight: 200 1000;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: 62.5%;
      margin: 0;
      padding: 0;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    :root {
      --paper: #fafafa;
      --ink: #1d1d1b;
      --brand-color: #1d1d1b;
      --site-gutter-left: 8rem;
      --site-gutter-right: 8rem;
      --muted: rgba(29, 29, 27, 0.72);
      --strip-gap: 2px;
      --outer-gutter: 12px;
      --meta-side-margin: 38px;
      --page-side-margin: 180px;
      --meta-size: 12.6px;
      --meta-track: 0.08em;
      --edge-band: 42px;
      --hover-scale: 1.5;
      --lateral-gap: 4px;
      --miolo-grid-scale: 0.25;
      --lateral-tile-size: calc((100vh - (var(--edge-band) * 2)) * var(--miolo-grid-scale));
    }

    body {
      --brand-color: #000000;
      --site-gutter-left: 8rem;
      --site-gutter-right: 8rem;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: rgba(255, 255, 255, 0.72);
      color: var(--brand-color);
      font-family: "Monument Grotesk Variable", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      font-variation-settings: "slnt" 0, "MONO" 0;
      overflow-x: hidden;
    }

    img {
      border: 0;
      padding: 0;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .edge-meta {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: flex-start;
      padding: 12px calc(var(--outer-gutter) + var(--meta-side-margin));
      font-size: var(--meta-size);
      font-weight: 700;
      letter-spacing: var(--meta-track);
      text-transform: uppercase;
      line-height: 1;
      color: var(--ink);
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .edge-meta a,
    .edge-meta button {
      pointer-events: auto;
    }

    .edge-meta--top {
      top: 0;
      align-items: center;
      z-index: 200;
    }

    .edge-meta--bottom {
      bottom: 0;
      align-items: flex-end;
      z-index: 3;
    }

    .edge-meta__center,
    .edge-meta__right,
    .edge-meta__left {
      display: flex;
      gap: 14px;
      align-items: center;
      white-space: nowrap;
    }

    .edge-meta__center {
      justify-content: center;
      justify-self: center;
    }

    .edge-meta__left {
      justify-self: start;
    }

    .edge-meta__right {
      justify-self: end;
    }

    .edge-meta__home {
      display: block;
      pointer-events: auto;
    }

    .edge-meta__brand {
      width: clamp(116px, 15vw, 210px);
      height: auto;
      filter: brightness(0) saturate(100%);
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .edge-meta__left,
    .edge-meta__right {
      flex: 0 0 auto;
    }

    .edge-meta__bottom-note {
      max-width: 180px;
      white-space: normal;
      line-height: 1.16;
      text-align: left;
      transform: translateX(-58px);
    }

    #nav-about-btn,
    #nav-close-btn {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      line-height: 1;
      text-transform: uppercase;
      cursor: pointer;
    }

    #nav-close-btn {
      display: none;
    }

    #about-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #about-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #about-text {
      max-width: 800px;
      width: calc(100% - var(--site-gutter-left) - var(--site-gutter-right));
      text-align: justify;
      font-family: Helvetica;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.24;
      color: var(--brand-color);
      letter-spacing: 0.01em;
      text-transform: lowercase;
    }

    #about-text p {
      margin: 0 0 1.45em 0;
    }

    #about-text p:last-child {
      margin-bottom: 0;
      letter-spacing: 0.08em;
      text-align: justify;
    }

    #about-text .about-contact {
      padding-top: 1.2em;
      font-size: 0.85em;
      letter-spacing: 0.03em;
      text-align: right;
    }

    #about-text p.about-contact:last-child {
      text-align: right;
      letter-spacing: 0.03em;
    }

    #about-text .about-contact::before {
      content: "";
      display: block;
      width: 100%;
      border-top: 1px solid currentColor;
      opacity: 0.35;
      margin-bottom: 1.2em;
    }

    #about-text .about-contact .contact-separator {
      display: inline-block;
      margin: 0 0.45em;
      opacity: 0.5;
    }

    #about-text .about-contact-label {
      font-weight: 700;
    }
    #blog-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--edge-band) var(--page-side-margin);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    #blog-wrap::-webkit-scrollbar {
      display: none;
    }

    .post-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: clamp(2rem, 2vw, 3rem);
      row-gap: clamp(2rem, 2vw, 3rem);
      width: 100%;
      max-width: 100%;
      align-content: center;
      justify-items: stretch;
      margin: auto 0;
    }

    .post-card {
      display: block;
      cursor: pointer;
    }

    .post-image {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.04);
    }

    .post-image img,
    .post-image video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      will-change: transform;
    }

    .post-card:hover .post-image img,
    .post-card:hover .post-image video {
      transform: scale(1.03);
    }

    .post-card.is-bw .post-image img,
    .post-card.is-bw .post-image video {
      filter: grayscale(1);
    }

    .post-card.is-bw:hover .post-image img,
    .post-card.is-bw:hover .post-image video {
      filter: grayscale(0);
    }

    .post-title {
      margin: 1.2rem 0 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1.55rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.01em;
      text-align: justify;
      text-align-last: justify;
      text-transform: lowercase;
    }

    .post-title::after {
      content: "";
      display: inline-block;
      width: 100%;
    }

    #grain-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10000;
      opacity: 0.42;
    }

    @media (max-width: 960px) {
      :root {
        --outer-gutter: 10px;
        --meta-side-margin: 18px;
        --page-side-margin: 14px;
        --edge-band: 40px;
        --lateral-gap: 0px;
      }

      .edge-meta__right,
      .edge-meta__left {
        gap: 10px;
      }

      .edge-meta__brand {
        width: clamp(108px, 20vw, 176px);
      }

      #home-lightbox {
        --lightbox-main-height: 58vh;
      }

      .home-lightbox__track {
        gap: 1.2rem;
        padding: 0 4.8rem;
      }

      .home-lightbox__side-image {
        max-width: min(26vw, 180px);
      }

      #home-lightbox-img {
        max-width: 84vw;
      }
    }

    @media (max-width: 900px) {
      .post-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 2rem;
        row-gap: 2rem;
      }
    }

    @media (max-width: 640px) {
      :root {
        --outer-gutter: 8px;
        --meta-side-margin: 0px;
        --page-side-margin: 10px;
        --meta-size: 11.2px;
        --edge-band: 82px;
        --lateral-gap: 0px;
        --miolo-grid-scale: 0.62;
      }

      html,
      body {
        overflow: hidden;
      }

      .edge-meta {
        mix-blend-mode: normal;
      }

      .edge-meta--top {
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas:
          "brand brand"
          "left right";
        row-gap: 6px;
        align-items: center;
        padding: 8px var(--outer-gutter) 6px;
        background: rgba(250, 250, 250, 0.92);
      }

      .edge-meta--top .edge-meta__left {
        grid-area: left;
      }

      .edge-meta--top .edge-meta__center {
        grid-area: brand;
      }

      .edge-meta--top .edge-meta__right {
        grid-area: right;
        gap: 8px;
      }

      .edge-meta--top a,
      .edge-meta--top button {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
      }

      .edge-meta--bottom {
        position: static;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 0 var(--outer-gutter) 28px;
        background: var(--paper);
      }

      .edge-meta--bottom .edge-meta__left {
        display: none;
      }

      .edge-meta--bottom .edge-meta__center {
        justify-content: flex-start;
        white-space: normal;
      }

      .edge-meta--bottom .edge-meta__right {
        justify-content: flex-end;
      }

      #about-overlay {
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: calc(var(--edge-band) + 18px) 20px 40px;
      }

      #about-text {
        width: min(100%, 34rem);
        max-width: none;
        font-size: 1.6rem;
        line-height: 1.38;
        text-align: left;
        letter-spacing: 0;
      }

      #about-text p:last-child,
      #about-text p.about-contact:last-child {
        text-align: left;
        letter-spacing: 0;
      }

      #about-text .about-contact {
        font-size: 1.4rem;
        text-align: left;
        overflow-wrap: anywhere;
      }

      #about-text .about-contact a {
        display: block;
        margin-top: 0.35em;
      }

      #about-text .about-contact .contact-separator {
        display: none;
      }

      .edge-meta__bottom-note {
        max-width: 124px;
        transform: none;
      }

      .edge-meta__brand {
        width: clamp(98px, 28vw, 124px);
      }

      #blog-wrap {
        padding: var(--edge-band) var(--outer-gutter);
      }

      .post-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 1.2rem;
        row-gap: 1.2rem;
      }

      .post-title {
        margin-top: 0.8rem;
        font-size: 1.15rem;
        line-height: 1.15;
      }

      .home-lightbox__track {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 1rem;
        padding: 0 1.2rem;
      }

      .home-lightbox__main {
        justify-self: stretch;
      }

      .home-lightbox__side-image {
        display: none;
      }

      #home-lightbox-img {
        width: 100%;
        max-width: 100%;
        height: auto;
        max-height: 66vh;
      }

      #home-lightbox-caption {
        top: calc(100% + 18px);
        max-width: 86vw;
        font-size: 11px;
        letter-spacing: 0.24em;
      }

      #home-lightbox-prev,
      #home-lightbox-next,
      #home-lightbox-close {
        min-width: 44px;
        min-height: 44px;
      }

      #home-lightbox-prev {
        left: 8px;
      }

      #home-lightbox-next {
        right: 8px;
      }

      #home-lightbox-close {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="edge-meta edge-meta--top">
    <nav class="edge-meta__left" aria-label="Navegação institucional">
      <button id="nav-about-btn" type="button" aria-label="Abrir sobre">about</button>
      <button id="nav-close-btn" type="button" aria-label="Fechar sobre">close</button>
    </nav>
    <div class="edge-meta__center">
      <a class="edge-meta__home" href="../" aria-label="Ir para a home do casamento">
        <img class="edge-meta__brand" src="../img/brand/marca-p-clean.svg" alt="miolo">
      </a>
    </div>
    <nav class="edge-meta__right" aria-label="Navegação">
      <a href="./">MIOLO — Casamentos</a>
    </nav>
  </header>

    <main id="blog-wrap" aria-label="MIOLO — Casamentos">
      <section class="post-grid" aria-label="posts">
      <a class="post-card" href="posts/ale-mah/">
        <div class="post-image">
          <img src="img/posts/ale-mah/001.webp" alt="" loading="lazy" decoding="async">
        </div>
        <h2 class="post-title">{ale bigliazzi + mah}</h2>
      </a>
      <a class="post-card" href="posts/bianca-felipe/">
        <div class="post-image">
          <img src="img/posts/bianca-felipe/001__1300_16343750-95e0-4f47-a3cf-f8725d437757.webp" alt="" loading="lazy" decoding="async">
        </div>
        <h2 class="post-title">{bianca + felipe}</h2>
      </a>

      <a class="post-card" href="posts/bruno-caro/">
        <div class="post-image">
          <img src="img/posts/bruno-caro/super-camera-x-planeta-brasil-001-2560x1708.webp" alt="" loading="lazy" decoding="async">
        </div>
        <h2 class="post-title">{bruno + caro}</h2>
      </a>

      <a class="post-card" href="posts/carol-ian/">
        <div class="post-image">
          <img src="img/posts/carol-ian/001__1300_a468f0b3-836b-4fc9-aa22-9a7b6889c200.webp" alt="" loading="lazy" decoding="async">
        </div>

      <a class="post-card" href="posts/pedro-ju/">
        <div class="post-image">
          <img src="img/posts/pedro-ju/001__1300_03a7ef14-403e-4959-a199-96e9d8045db1.webp" alt="" loading="lazy" decoding="async">
        </div>

      <a class="post-card" href="posts/sissa-dani/">
        <div class="post-image">
          <img src="img/posts/sissa-dani/001__1300_ad0e6278-bbaf-413c-85c1-3d2683928844.webp" alt="" loading="lazy" decoding="async">
        </div>
        <h2 class="post-title">{sissa + dani}</h2>
      </a>

      <a class="post-card" href="posts/vanessa-vitor/">
        <div class="post-image">
          <img src="img/posts/vanessa-vitor/001__1300_f2d1e637-2ce5-44b5-9f4d-49de8e41d923.webp" alt="" loading="lazy" decoding="async">
        </div>
        <h2 class="post-title">{vanessa + vitor}</h2>
      </a>
    </section>
  </main>


  <footer class="edge-meta edge-meta--bottom" aria-hidden="true">
    <div class="edge-meta__left"></div>
    <div class="edge-meta__center">salvador · bh · sp · rio · floripa</div>
    <div class="edge-meta__right">
      <span class="edge-meta__bottom-note">explore.<br>conteudo, imagem<br>e presenca.</span>
    </div>
  </footer>
  <canvas id="grain-canvas" aria-hidden="true"></canvas>

  <script>
    (function () {
      const grainCanvas = document.getElementById('grain-canvas');
      const grainCtx = grainCanvas.getContext('2d', { alpha: true });

      function resizeGrainCanvas() {
        grainCanvas.width = window.innerWidth;
        grainCanvas.height = window.innerHeight;
      }

      function drawGrain() {
        const width = grainCanvas.width;
        const height = grainCanvas.height;
        const imageData = grainCtx.createImageData(width, height);
        const buffer = imageData.data;

        for (let i = 0; i < buffer.length; i += 4) {
          const noise = Math.random() * 255;
          const alpha = Math.random() > 0.55 ? 95 : 35;

          buffer[i] = noise;
          buffer[i + 1] = noise;
          buffer[i + 2] = noise;
          buffer[i + 3] = alpha;
        }

        grainCtx.putImageData(imageData, 0, 0);
      }

      resizeGrainCanvas();
      drawGrain();

      window.addEventListener('resize', () => {
        resizeGrainCanvas();
        drawGrain();
      });
    })();
  </script>
</body>
</html>
